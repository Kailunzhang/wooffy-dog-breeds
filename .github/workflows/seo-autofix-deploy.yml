name: Wooffy Content Deploy

# When breed-data/*.json changes land on main (e.g. an SEO-autofix PR
# is merged, or you edit content directly), push ONLY the changed
# articles to Shopify via generate.py --update.
#
# Note: this makes main the source of truth — any breed-data change
# merged to main auto-syncs to the live store. That is intentional
# (merge = ship), but be aware non-autofix breed-data edits also
# deploy.

on:
  push:
    branches: [main]
    paths:
      - 'breed-data/**'
  # Manual re-deploy of specific slugs, e.g. to retry an article that failed
  # with a transient Shopify error (image download, 429).
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Space-separated breed-data slugs to re-push (empty = changed files of the last push)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: when one push carries several commits,
          # github.event.before is not in a depth-2 clone, the slug diff below
          # comes up empty and the run goes green without deploying anything.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create .env
        run: |
          printf 'SHOPIFY_STORE=%s\nSHOPIFY_TOKEN=%s\nSHOPIFY_BLOG_ID=%s\nSHOPIFY_DOG_NUTRITION_BLOG_ID=%s\n' \
            "${{ secrets.SHOPIFY_STORE }}" \
            "${{ secrets.SHOPIFY_TOKEN }}" \
            "${{ secrets.SHOPIFY_BLOG_ID }}" \
            "${{ secrets.SHOPIFY_DOG_NUTRITION_BLOG_ID }}" > .env

      - name: Update changed articles on Shopify
        run: |
          SLUGS="${{ github.event.inputs.slugs }}"
          if [ -z "$(echo $SLUGS | tr -d ' ')" ]; then
            BEFORE='${{ github.event.before }}'
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD^"
            fi
            SLUGS=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'breed-data/*.json' \
              | sed 's@^breed-data/@@; s@\.json$@@' | sort -u | tr '\n' ' ')
          fi
          echo "Slugs to deploy: $SLUGS"
          if [ -z "$(echo $SLUGS | tr -d ' ')" ]; then
            echo "No breed-data slugs changed; nothing to deploy."
            exit 0
          fi
          # --touch-updated stamps meta.content_updated (visible "Last updated"
          # line + custom.content_updated metafield -> schema dateModified) and
          # writes it back to the JSON, committed below so main stays in sync.
          echo YES | python3 scripts/generate.py $SLUGS --update --touch-updated

      - name: Commit content_updated stamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add breed-data
          if git diff --cached --quiet; then
            echo "no stamp changes to commit"
          else
            git commit -m "chore: stamp content_updated after deploy [skip ci]"
            # main may have moved during a long deploy; rebase our stamp commit on top.
            # --autostash: generate.py --update also rewrites ARTICLES.md (its
            # "Last updated" date), which is not committed here; on a dirty tree
            # plain `git pull --rebase` exits 128 and the stamps never reach main.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "rebase or push failed, retrying ($i)"; sleep 5
            done
            echo "::error::could not rebase and push the content_updated stamps after 3 attempts"
            exit 1
          fi

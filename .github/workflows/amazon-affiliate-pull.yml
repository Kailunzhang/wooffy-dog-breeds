name: Amazon affiliate data pull

# On-demand: GA4 outbound-Amazon clicks + page metrics and GSC page data for
# the affiliate analysis, committed under analytics/amazon-affiliate-<end>/.
# Runs on manual dispatch and whenever this workflow or its script changes.

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Window start (YYYY-MM-DD)'
        default: '2026-09-29'
      end:
        description: 'Window end (YYYY-MM-DD, default yesterday)'
        default: ''
  push:
    branches: [main]
    paths:
      - 'scripts/amazon_affiliate_pull.py'
      - '.github/workflows/amazon-affiliate-pull.yml'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-analytics-data google-auth

      - name: Pull GA4 + GSC data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_OAUTH_CLIENT_ID: ${{ secrets.GA4_OAUTH_CLIENT_ID }}
          GA4_OAUTH_CLIENT_SECRET: ${{ secrets.GA4_OAUTH_CLIENT_SECRET }}
          GA4_OAUTH_REFRESH_TOKEN: ${{ secrets.GA4_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          PULL_START: ${{ github.event.inputs.start }}
          PULL_END: ${{ github.event.inputs.end }}
        run: |
          ARGS="--start ${PULL_START:-2026-09-29}"
          if [ -n "$PULL_END" ]; then ARGS="$ARGS --end $PULL_END"; fi
          python3 scripts/amazon_affiliate_pull.py $ARGS

      - name: Commit the pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(amazon): affiliate analytics pull $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push
          fi

name: Wooffy Traffic Watch

# Daily GA4 traffic analysis -> emailed verdict + recommendations.
# Runs at 08:00 PDT (15:00 UTC), reporting the previous complete day.
# Required repo secrets:
#   GA4_PROPERTY_ID           numeric GA4 property id (Admin > Property Settings)
#   GA4_OAUTH_CLIENT_ID       OAuth desktop client id
#   GA4_OAUTH_CLIENT_SECRET   OAuth desktop client secret
#   GA4_OAUTH_REFRESH_TOKEN   refresh token from scripts/ga4_oauth_setup.py
#   ALERT_EMAIL_TO            recipient address
#   GMAIL_USER                sending Gmail address
#   GMAIL_APP_PASSWORD        Gmail app password for GMAIL_USER

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  traffic-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-analytics-data google-auth

      - name: Run traffic watch
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_OAUTH_CLIENT_ID: ${{ secrets.GA4_OAUTH_CLIENT_ID }}
          GA4_OAUTH_CLIENT_SECRET: ${{ secrets.GA4_OAUTH_CLIENT_SECRET }}
          GA4_OAUTH_REFRESH_TOKEN: ${{ secrets.GA4_OAUTH_REFRESH_TOKEN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 scripts/traffic_watch.py

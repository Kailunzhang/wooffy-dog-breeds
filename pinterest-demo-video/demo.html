<script type="text/babel">
/* ══════════════════ animations.jsx engine (inlined) ══════════════════ */
(function() {
  const { createContext, useContext, useState, useEffect, useRef, useCallback } = React;

  const TimeContext = createContext({ time: 0, duration: 10, playing: false });
  const SpriteContext = createContext(null);

  const Easing = {
    linear: t => t,
    easeIn: t => t * t,
    easeOut: t => 1 - (1 - t) * (1 - t),
    easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  };

  function interpolate(t, input, output, easing) {
    const [inStart, inEnd] = input;
    const [outStart, outEnd] = output;
    if (t <= inStart) return outStart;
    if (t >= inEnd) return outEnd;
    let progress = (t - inStart) / (inEnd - inStart);
    if (easing) progress = easing(progress);
    return outStart + (outEnd - outStart) * progress;
  }

  function useTime() { return useContext(TimeContext).time; }
  function useSprite() {
    const sprite = useContext(SpriteContext);
    if (!sprite) return { t: 0, elapsed: 0, duration: 0 };
    return sprite;
  }

  const stageStyles = {
    wrapper: { position: 'fixed', inset: 0, background: '#000', display: 'flex', flexDirection: 'column', fontFamily: '-apple-system, "Segoe UI", sans-serif' },
    stageHolder: { flex: 1, position: 'relative', overflow: 'hidden' },
    canvas: { position: 'absolute', top: '50%', left: '50%', transformOrigin: 'center center', background: '#111', overflow: 'hidden' },
    controls: { position: 'fixed', bottom: 0, left: 0, right: 0, background: 'rgba(0,0,0,0.8)', padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 16, color: '#fff', fontSize: 12, zIndex: 100 },
    button: { background: 'none', border: '1px solid rgba(255,255,255,0.3)', color: '#fff', padding: '6px 14px', borderRadius: 4, cursor: 'pointer', fontSize: 12 },
    timeDisplay: { fontFamily: 'ui-monospace, monospace', fontVariantNumeric: 'tabular-nums', minWidth: 90 },
    scrubber: { flex: 1, height: 4, background: 'rgba(255,255,255,0.2)', borderRadius: 2, position: 'relative', cursor: 'pointer' },
    scrubberFill: { position: 'absolute', top: 0, left: 0, height: '100%', background: '#fff', borderRadius: 2, pointerEvents: 'none' },
    scrubberHandle: { position: 'absolute', top: '50%', width: 12, height: 12, background: '#fff', borderRadius: '50%', transform: 'translate(-50%, -50%)', pointerEvents: 'none' },
  };

  function Stage({ duration = 10, width = 1920, height = 1080, loop = true, children, bgColor = '#fff' }) {
    const [time, setTime] = useState(0);
    const [playing, setPlaying] = useState(true);
    const [scale, setScale] = useState(1);
    const rafRef = useRef(null);

    const effectiveLoop = (typeof window !== 'undefined' && window.__recording) ? false : loop;

    useEffect(() => {
      function updateScale() {
        const vw = window.innerWidth;
        const vh = window.innerHeight - (window.__recording ? 0 : 56);
        setScale(Math.min(vw / width, vh / height));
      }
      updateScale();
      window.addEventListener('resize', updateScale);
      return () => window.removeEventListener('resize', updateScale);
    }, [width, height]);

    useEffect(() => {
      if (!playing) return;
      let cancelled = false;
      let last = null;

      function tick(now) {
        if (cancelled) return;
        if (last === null) {
          last = now;
          if (typeof window !== 'undefined') window.__ready = true;
        }
        const delta = (now - last) / 1000;
        last = now;
        setTime(prev => {
          const next = prev + delta;
          if (next >= duration) return effectiveLoop ? 0 : duration - 0.001;
          return next;
        });
        rafRef.current = requestAnimationFrame(tick);
      }

      const startAfterFonts = () => { if (!cancelled) rafRef.current = requestAnimationFrame(tick); };
      if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) {
        document.fonts.ready.then(startAfterFonts);
      } else {
        startAfterFonts();
      }
      return () => { cancelled = true; cancelAnimationFrame(rafRef.current); };
    }, [playing, duration, effectiveLoop]);

    useEffect(() => {
      window.__seek = (t) => setTime(t);
    }, []);

    const handleScrub = useCallback((e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      setTime(Math.max(0, Math.min(duration, ratio * duration)));
      setPlaying(false);
    }, [duration]);

    const progress = time / duration;
    const canvasStyle = { ...stageStyles.canvas, width, height, background: bgColor, transform: `translate(-50%, -50%) scale(${scale})` };

    return (
      <TimeContext.Provider value={{ time, duration, playing, setPlaying, setTime }}>
        <div style={stageStyles.wrapper}>
          <div style={stageStyles.stageHolder}>
            <div style={canvasStyle}>{children}</div>
          </div>
          <div style={stageStyles.controls} className="no-record">
            <button style={stageStyles.button} onClick={() => setPlaying(p => !p)}>{playing ? '⏸' : '▶'}</button>
            <button style={stageStyles.button} onClick={() => setTime(0)}>⏮</button>
            <div style={stageStyles.timeDisplay}>{time.toFixed(2)}s / {duration.toFixed(2)}s</div>
            <div style={stageStyles.scrubber} onMouseDown={handleScrub}>
              <div style={{ ...stageStyles.scrubberFill, width: `${progress * 100}%` }} />
              <div style={{ ...stageStyles.scrubberHandle, left: `${progress * 100}%` }} />
            </div>
          </div>
        </div>
      </TimeContext.Provider>
    );
  }

  function Sprite({ start = 0, end, children, style }) {
    const { time } = useContext(TimeContext);
    const actualEnd = end == null ? Infinity : end;
    if (time < start || time >= actualEnd) return null;
    const duration = actualEnd - start;
    const elapsed = time - start;
    const t = duration === 0 ? 1 : Math.max(0, Math.min(1, elapsed / duration));
    return (
      <SpriteContext.Provider value={{ t, elapsed, duration, start, end: actualEnd }}>
        <div style={{ position: 'absolute', inset: 0, ...style }}>{children}</div>
      </SpriteContext.Provider>
    );
  }

  window.Animations = { Stage, Sprite, useTime, useSprite, Easing, interpolate };
})();
</script>

<script type="text/babel">
/* ══════════════════ Demo content ══════════════════
   All data below is REAL: captured from live API calls and actual
   script runs against the @wooffy_official account on 2026-07-11.
*/
const { Stage, Sprite, useSprite, Easing, interpolate } = window.Animations;

const INK = '#221F1C';
const PAPER = '#FBF9F5';
const MUTED = '#8A857D';
const ACCENT = '#E60023';           /* Pinterest red — Pinterest-related marks only */

  { name: 'Dog Breed Guides',     id: '925982442074840407' },
  { name: 'Best Dogs For...',     id: '925982442074840408' },
  { name: 'Dog Care & Grooming',  id: '925982442074840409' },
  { name: 'Puppy Costs & Budget', id: '925982442074840410' },
  { name: 'Doodle Dogs',          id: '925982442074840411' },
  { name: 'Dog Tech & Gear',      id: '925982442074840412' },
  { name: 'Dog Health',           id: '925982442074840413' },
  { name: 'Seasonal Dog Care',    id: '925982442074840414' },
];

/* ── shared building blocks ─────────────────────────────── */

function SceneFade({ children, fadeOut = 0.5, bg = PAPER }) {
  const { elapsed, duration } = useSprite();
  const inO = interpolate(elapsed, [0, 0.5], [0, 1], Easing.easeOut);
  const outO = fadeOut > 0 ? interpolate(elapsed, [duration - fadeOut, duration], [1, 0], Easing.easeIn) : 1;
  return (
    <div style={{ position: 'absolute', inset: 0, background: bg, opacity: Math.min(inO, outO) }}>
      {children}
    </div>
  );
}

function Kicker({ step, label }) {
  return (
    <div style={{ position: 'absolute', top: 64, left: 96, right: 96, display: 'flex', alignItems: 'baseline', gap: 24, borderBottom: `2px solid ${INK}`, paddingBottom: 18 }}>
      <span style={{ fontFamily: MONO, fontSize: 20, letterSpacing: '0.18em', color: MUTED }}>WOOFFY PINTEREST PUBLISHER · APP DEMO</span>
      <span style={{ flex: 1 }} />
      {step && <span style={{ fontFamily: MONO, fontSize: 20, color: ACCENT, letterSpacing: '0.1em' }}>{step}</span>}
      {label && <span style={{ fontFamily: SANS, fontSize: 22, fontWeight: 600, color: INK }}>{label}</span>}
    </div>
  );
}

function Rise({ at = 0, children, style }) {
  const { elapsed } = useSprite();
  const p = interpolate(elapsed, [at, at + 0.7], [0, 1], Easing.expoOut);
  return <div style={{ opacity: p, transform: `translateY(${(1 - p) * 24}px)`, ...style }}>{children}</div>;
}

/* Terminal window with timed, typed lines.
   line: { at, text, color?, typed? } — typed lines animate char-by-char */
function Terminal({ title, lines, width = '100%', height, fontSize = 23 }) {
  const { elapsed } = useSprite();
  const visible = lines.filter(l => elapsed >= l.at);
  return (
    <div style={{ width, height, background: '#17191E', borderRadius: 10, overflow: 'hidden', boxShadow: '0 18px 50px rgba(30,25,20,0.18)', display: 'flex', flexDirection: 'column' }}>
      <div style={{ background: '#22252C', padding: '12px 20px', fontFamily: MONO, fontSize: 17, color: '#9AA0AA', letterSpacing: '0.06em' }}>{title}</div>
      <div style={{ padding: '22px 26px', fontFamily: MONO, fontSize, lineHeight: 1.62, whiteSpace: 'pre-wrap', flex: 1 }}>
        {visible.map((l, i) => {
          let text = l.text;
          let caret = false;
          if (l.typed) {
            const dur = Math.max(0.5, l.text.length * 0.022);
            const n = Math.floor(interpolate(elapsed, [l.at, l.at + dur], [0, l.text.length]));
            caret = n < l.text.length;
            text = l.text.slice(0, n);
          }
          return (
            <div key={i} style={{ color: l.color || '#D8DCE2', minHeight: '1.62em' }}>
              {text}{caret && <span style={{ background: '#D8DCE2', color: '#17191E' }}>▌</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── Scene 1 · Title (0–12s) ────────────────────────────── */

            A server-side script that publishes our own dog-breed articles from <b>thewooffy.com</b> as
            Pins — to our own Pinterest business account{' '}
            <span style={{ fontFamily: MONO, fontSize: 27, color: ACCENT }}>@wooffy_official</span>.

      </div>
    </SceneFade>
  );
}

function S2() {

    { at: 1.0, n: '1', t: 'One-time consent', d: 'Our account owner approves the app via Pinterest’s OAuth consent screen (authorization-code flow).' },

    { at: 3.4, n: '3', t: 'Automatic refresh', d: 'Before each run the script refreshes the token via POST /v5/oauth/token.' },
  ];
  const termLines = [
    { at: 5.0,  text: '$ python scripts/pinterest_api.py status', typed: true, color: '#7FD1A8' },
    { at: 6.6,  text: '· refreshing access token — POST /v5/oauth/token (grant_type=refresh_token)', color: '#9AA0AA' },
    { at: 7.8,  text: '→ 200 OK · token valid, expires in 30 days', color: '#7FD1A8' },
    { at: 9.2,  text: '' },
    { at: 9.2,  text: '· verifying account — GET /v5/user_account', color: '#9AA0AA' },
    { at: 10.4, text: '→ 200 OK', color: '#7FD1A8' },
    { at: 11.2, text: '{' },
    { at: 11.4, text: '  "username":     "wooffy_official",' },
    { at: 11.6, text: '  "account_type": "BUSINESS",' },
    { at: 11.8, text: '  "pin_count":    1033,' },
    { at: 12.0, text: '  "board_count":  43' },
    { at: 12.2, text: '}' },
  ];
  return (
    <SceneFade>
      <Kicker step="STEP 1 / 3" label="Authentication — OAuth 2.0" />
      <div style={{ position: 'absolute', top: 190, left: 96, right: 96, bottom: 90, display: 'flex', gap: 64 }}>
        <div style={{ width: 620, display: 'flex', flexDirection: 'column', gap: 40, paddingTop: 30 }}>
          {steps.map(s => {
            const p = interpolate(elapsed, [s.at, s.at + 0.7], [0, 1], Easing.expoOut);
            return (
              <div key={s.n} style={{ opacity: p, transform: `translateY(${(1 - p) * 20}px)`, display: 'flex', gap: 26 }}>
                <div style={{ width: 56, height: 56, border: `2.5px solid ${INK}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: SERIF, fontSize: 30, fontWeight: 700, color: INK, flexShrink: 0 }}>{s.n}</div>
                <div>
                  <div style={{ fontFamily: SANS, fontSize: 29, fontWeight: 700, color: INK }}>{s.t}</div>
                  <div style={{ fontFamily: SANS, fontSize: 23, color: '#5A554E', lineHeight: 1.55, marginTop: 8 }}>{s.d}</div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ flex: 1, paddingTop: 30 }}>
          <Rise at={4.4} style={{ height: '100%' }}>
            <Terminal title="wooffy-dog-breeds — live API trace · api.pinterest.com/v5" lines={termLines} height={640} />
          </Rise>

      </div>
    </SceneFade>
  );
}

        </Rise>
        <Rise at={2.6}>
          <div style={{ fontFamily: SANS, fontSize: 27, color: '#5A554E', marginTop: 60, lineHeight: 1.8 }}>
            No third-party users · no data collection · no external distribution<br />
            Thank you for reviewing.
          </div>
        </Rise>
        <Rise at={3.4}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginTop: 56 }}>
            <img src="assets/avatar.jpg" style={{ width: 60, height: 60, borderRadius: '50%', border: `2px solid ${INK}` }} />
            <span style={{ fontFamily: MONO, fontSize: 24, color: ACCENT }}>@wooffy_official</span>
            <span style={{ fontFamily: MONO, fontSize: 24, color: MUTED }}>· thewooffy.com</span>
          </div>
        </Rise>
      </div>
    </SceneFade>
  );
}

/* ── Root ───────────────────────────────────────────────── */
function App() {
  return (
    <Stage duration={90} width={1920} height={1080} bgColor={PAPER}>
      <Sprite start={0}    end={12.5}><S1 /></Sprite>
      <Sprite start={12}   end={34.5}><S2 /></Sprite>
      <Sprite start={34}   end={64.5}><S3 /></Sprite>
      <Sprite start={64}   end={80.5}><S4 /></Sprite>
      <Sprite start={80}   end={90}  ><S5 /></Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
